<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shop Board</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

h1 {
  text-align: center;
  font-size: 40px;
  margin: 20px 0;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 14px;
  border-bottom: 1px solid #333;
  font-size: 20px;
}

th {
  background: #222;
}

.number {
  width: 40px;
  text-align: center;
  color: #aaa;
  font-weight: bold;
}

select, input[type="date"] {
  font-size: 18px;
  padding: 4px;
}

.not-started { background: #e74c3c; }
.in-progress { background: #2ecc71; color: #000; }
.delayed { background: #f1c40f; color: #000; }
.complete { background: #3498db; }

.actions button,
.actions span {
  cursor: pointer;
  font-size: 18px;
  margin-right: 6px;
}

.archive-btn {
  background: none;
  border: none;
  color: #fff;
}

.delete {
  color: #ff6666;
}

tr.dragging {
  opacity: 0.5;
}

button.add {
  margin: 16px;
  font-size: 18px;
  padding: 8px 14px;
}
</style>
</head>

<body>

<h1>Shop Board</h1>

<table>
<thead>
<tr>
  <th>#</th>
  <th>Project</th>
  <th>Status</th>
  <th>Description</th>
  <th>Due By</th>
  <th>Materials</th>
  <th>Notes</th>
  <th>Actions</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<button class="add" onclick="addRow()">➕ Add Job</button>

<script>
/* ================= CONFIG ================= */
const API_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";
const MODE = new URLSearchParams(window.location.search).get("mode") || "active";
const IS_HISTORY = MODE === "history";
/* ========================================== */

const tbody = document.getElementById("tbody");
let dragged = null;

/* ---------- STATUS SELECT ---------- */
function statusSel(v = "not-started") {
  return `
    <select class="${v}">
      <option value="not-started">Not Started</option>
      <option value="in-progress">In Progress</option>
      <option value="delayed">Delayed</option>
      <option value="complete">Complete</option>
      <option value="complete_archived" style="display:none">
        Complete (Archived)
      </option>
    </select>
  `;
}

/* ---------- LOAD (JSONP) ---------- */
function load() {
  window.loadData = function(rows) {
    tbody.innerHTML = "";

    rows
      .filter(r =>
        IS_HISTORY
          ? r[2] === "complete_archived"
          : r[2] !== "complete_archived"
      )
      .forEach(r => addRowFromData({
        order: r[0],
        project: r[1],
        status: r[2],
        description: r[3],
        due: r[4],
        materials: r[5],
        notes: r[6]
      }));

    renumber();
  };

  const s = document.createElement("script");
  s.src = `${API_URL}?callback=loadData&ts=${Date.now()}`;
  document.body.appendChild(s);
}

/* ---------- SAVE ---------- */
async function save() {
  if (IS_HISTORY) return;

  const data = [];
  [...tbody.children].forEach((tr, i) => {
    const sel = tr.querySelector("select");
    data.push({
      order: i + 1,
      project: tr.children[1].innerText,
      status: sel.value,
      description: tr.children[3].innerText,
      due: tr.children[4].querySelector("input").value,
      materials: tr.children[5].innerText,
      notes: tr.children[6].innerText
    });
  });

  await fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(data)
  });
}

/* ---------- ARCHIVE ---------- */
function archiveRow(tr) {
  const sel = tr.querySelector("select");
  if (sel.value !== "complete") {
    alert("Only completed jobs can be archived.");
    return;
  }

  if (!confirm("Archive this job to History?")) return;

  sel.value = "complete_archived";
  sel.className = "complete";
  save();
  tr.remove();
  renumber();
}

/* ---------- ROW ---------- */
function addRowFromData(d = {}) {
  const tr = document.createElement("tr");
  tr.draggable = !IS_HISTORY;

  tr.innerHTML = `
    <td class="number"></td>
    <td contenteditable="${!IS_HISTORY}">${d.project || ""}</td>
    <td>${statusSel(d.status)}</td>
    <td contenteditable="${!IS_HISTORY}">${d.description || ""}</td>
    <td><input type="date" value="${d.due || ""}" ${IS_HISTORY ? "disabled" : ""}></td>
    <td contenteditable="${!IS_HISTORY}">${d.materials || ""}</td>
    <td contenteditable="${!IS_HISTORY}">${d.notes || ""}</td>
    <td class="actions"></td>
  `;

  const actions = tr.querySelector(".actions");

  if (!IS_HISTORY) {
    const archive = document.createElement("button");
    archive.innerText = "📦";
    archive.className = "archive-btn";
    archive.onclick = () => archiveRow(tr);
    actions.appendChild(archive);

    const del = document.createElement("span");
    del.className = "delete";
    del.innerText = "✖";
    del.onclick = () => { tr.remove(); renumber(); save(); };
    actions.appendChild(del);

    tr.querySelectorAll("select, input, [contenteditable]").forEach(e =>
      e.oninput = save
    );

    enableDrag(tr);
  }

  tbody.appendChild(tr);
}

/* ---------- ADD ---------- */
function addRow() {
  addRowFromData();
  renumber();
  save();
}

/* ---------- ORDER ---------- */
function renumber() {
  [...tbody.children].forEach((r, i) => r.children[0].innerText = i + 1);
}

/* ---------- DRAG ---------- */
function enableDrag(r) {
  r.ondragstart = () => { dragged = r; r.classList.add("dragging"); };
  r.ondragend = () => { r.classList.remove("dragging"); dragged = null; save(); };
  r.ondragover = e => {
    e.preventDefault();
    if (r === dragged) return;
    const next = e.clientY - r.getBoundingClientRect().top > r.offsetHeight / 2;
    tbody.insertBefore(dragged, next ? r.nextSibling : r);
  };
}

load();
</script>
</body>
</html>
