<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shop Projects</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin: 20px 0;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 18px;
  border-bottom: 1px solid #333;
  font-size: 22px;
}

th {
  background: #222;
  text-align: left;
}

.number {
  width: 60px;
  text-align: center;
  font-weight: bold;
  color: #ccc;
}

td[contenteditable] {
  outline: none;
}

select, input[type="date"] {
  font-size: 20px;
  padding: 6px;
}

.in-progress { background: #2ecc71; color:#000; }
.not-started { background: #e74c3c; color:#fff; }
.blocked { background: #f1c40f; color:#000; }
.complete { background: #3498db; color:#fff; }

button {
  margin: 20px;
  font-size: 20px;
  padding: 10px 16px;
}

.delete {
  cursor: pointer;
  color: #ff6666;
  font-size: 24px;
}

tr {
  cursor: grab;
}

tr.dragging {
  opacity: 0.5;
}
</style>
</head>

<body>

<h1>Shop Projects</h1>

<table>
  <thead>
    <tr>
      <th class="number">#</th>
      <th>Project</th>
      <th>Status</th>
      <th>Description</th>
      <th>Due By</th>
      <th>Materials Needed</th>
      <th>Notes</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<button onclick="addRow()">➕ Add Project</button>

<script>
const API_URL = "https://script.google.com/macros/s/NEW_ID/exec";
const tbody = document.getElementById("tbody");
let draggedRow = null;

/* -------- Load -------- */
async function load() {
  const res = await fetch(API_URL);
  const rows = await res.json();
  tbody.innerHTML = "";

  rows.forEach(r => addRowFromData({
    order: r[0],
    project: r[1],
    status: r[2],
    description: r[3],
    due: r[4],
    materials: r[5],
    notes: r[6]
  }));

  renumber();
}

/* -------- Save -------- */

let saving = false;
let saveQueued = false;

async function save() {
  if (saving) {
    saveQueued = true;
    return;
  }

  saving = true;

  const data = [];
  document.querySelectorAll("tbody tr").forEach((tr, i) => {
    data.push({
      order: i + 1,
      project: tr.children[1].innerText,
      status: tr.children[2].querySelector("select").value,
      description: tr.children[3].innerText,
      due: tr.children[4].querySelector("input").value,
      materials: tr.children[5].innerText,
      notes: tr.children[6].innerText
    });
  });

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(data)
  });

  saving = false;

  if (saveQueued) {
    saveQueued = false;
    save();
  }
}


/* -------- Helpers -------- */
function statusSelect(val="not-started") {
  return `
    <select class="${val}" onchange="this.className=this.value; save()">
      <option value="not-started">Not Started</option>
      <option value="in-progress">In Progress</option>
      <option value="blocked">Blocked</option>
      <option value="complete">Complete</option>
    </select>`;
}

function addRowFromData(d={}) {
  const tr = document.createElement("tr");
  tr.draggable = true;

  tr.innerHTML = `
    <td class="number"></td>
    <td contenteditable>${d.project||""}</td>
    <td>${statusSelect(d.status)}</td>
    <td contenteditable>${d.description||""}</td>
    <td><input type="date" value="${d.due||""}"></td>
    <td contenteditable>${d.materials||""}</td>
    <td contenteditable>${d.notes||""}</td>
    <td class="delete" onclick="this.parentElement.remove(); renumber(); save()">✖</td>
  `;

  tbody.appendChild(tr);

  tr.querySelectorAll('[contenteditable], select, input')
    .forEach(el => el.addEventListener("input", save));

  enableDrag(tr);
}

function addRow() {
  addRowFromData();
  renumber();
  save();
}

function renumber() {
  document.querySelectorAll("tbody tr").forEach((tr, i) => {
    tr.querySelector(".number").innerText = i + 1;
  });
}

/* -------- Drag -------- */
function enableDrag(row) {
  row.addEventListener("dragstart", () => {
    draggedRow = row;
    row.classList.add("dragging");
  });

  row.addEventListener("dragend", () => {
    row.classList.remove("dragging");
    draggedRow = null;
    renumber();
    save();
  });

  row.addEventListener("dragover", e => {
    e.preventDefault();
    if (row === draggedRow) return;
    const rect = row.getBoundingClientRect();
    const next = (e.clientY - rect.top) > rect.height / 2;
    tbody.insertBefore(draggedRow, next ? row.nextSibling : row);
  });
}

load();
</script>
</body>
</html>
